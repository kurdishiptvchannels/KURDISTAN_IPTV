name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip Project if needed
      run: |
        if [ -f KURDISTAN_IPTV_Android_TS_FIXED.zip ]; then
          unzip KURDISTAN_IPTV_Android_TS_FIXED.zip
        fi

    - name: Build Debug APK with Gradle
      run: |
        cd KURDISTAN_IPTV_Android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: KURDISTAN_IPTV_Android/app/build/outputs/apk/debug/app-debug.apk
